[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-x"
version = "0.1.0"
description = "Claude-drafted posts and reply suggestions for X — you approve everything before it publishes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "jgframoz" }]
keywords = ["x", "twitter", "claude", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
# Points at run(), not app(), so deliberate errors render as a message instead
# of a traceback. Pointing this at app() silently disables that handling.
claude-x = "claude_x.cli:run"

[project.urls]
Repository = "https://github.com/jgframoz/claude-x"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_x"]

# Ship the voice guide inside the package so `claude-x voice` can seed it on a
# machine that has no checkout. The repo root copy stays the single source.
[tool.hatch.build.targets.wheel.force-include]
"VOICE.md" = "claude_x/data/VOICE.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
